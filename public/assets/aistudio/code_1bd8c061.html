    Ready to customize your profile
  </div>
</div>
<script>
  (function () {
    const toast = document.getElementById('profile-toast');
    let toastTimer;

    function showToast(message) {
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    const editBtn = document.getElementById('edit-profile-btn');
    if (editBtn) {
      editBtn.addEventListener('click', () => showToast('Opening Edit Profile...'));
    }

    const cameraBtn = document.getElementById('avatar-camera-btn');
    if (cameraBtn) {
      cameraBtn.addEventListener('click', () => showToast('Choose a new profile photo'));
    }

    document.querySelectorAll('.profile-menu-item').forEach((item) => {
      item.addEventListener('click', () => {
        const label = item.querySelector('.font-label-md')?.textContent || 'Section';
        showToast('Opening ' + label);
      });
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.05)]" data-active-classes="text-primary"><div class="flex justify-around items-center h-16 px-gutter"><a class="flex flex-col items-center justify-center min-w-[64px] h-12 text-on-surface-variant hover:text-on-surface transition-colors gap-0.5" data-path="discover" href="#"><span class="material-symbols-outlined text-[24px]">explore</span><span class="font-caption-xs text-caption-xs font-medium">Discover</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-12 text-on-surface-variant hover:text-on-surface transition-colors gap-0.5" data-path="inbox" href="#"><div class="relative flex items-center justify-center"><span class="material-symbols-outlined text-[24px]">chat_bubble</span><span class="absolute -top-1 -right-2 px-1.5 min-w-[18px] h-[18px] flex items-center justify-center bg-primary text-on-primary font-caption-xs text-[10px] font-bold rounded-full">3</span></div><span class="font-caption-xs text-caption-xs font-medium">Chats</span></a><a class="flex flex-col items-center justify-center min-w-[64px] h-12 text-on-surface-variant hover:text-on-surface transition-colors gap-0.5" data-path="profile" href="#"><span class="material-symbols-outlined text-[24px]">person</span><span class="font-caption-xs text-caption-xs font-medium">Profile</span></a></div></nav>
