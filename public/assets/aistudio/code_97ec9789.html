</head><body class="bg-surface text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-space-sm flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight ml-1">Edit Profile</h1></div><div class="flex items-center pr-2"><button class="px-space-sm py-space-xs rounded-lg font-label-md text-label-md text-primary-container hover:bg-primary-fixed/40 transition-colors mr-1" id="top-save-btn" type="button">Save</button><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDaQiji5_Cr4Eehc6hPoUMqXCF-xc9mgALLgoWdoPrGg2BSL466EYpxm5_VARuLqvpzYhQYuWntvBTWH2JEA8Xpp4LL5UIZvucCixdkoQOF-E0ODY2VnSnIZNonOTP4CAOnmvwLva8CJNlBnfzzyFpz87ObKPhyqAIRSv0WNVGePdouKJE4rBsWy4rywuNUgL1c3zTvxe8Z2TSiLJEVpECQfNPk3cUFO95o9Vs3S1VW"></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full px-space-md pb-space-xl gap-space-lg">

<div class="flex flex-col items-center gap-space-sm pt-space-xs">
<div class="relative">
<img alt="Ali Raza" class="w-24 h-24 rounded-full object-cover shadow-md bg-surface-container" data-alt="Warm, natural portrait of Ali Raza, a friendly young South Asian man in his late twenties wearing a casual indigo crewneck sweater, soft daylight, clean studio background with subtle cool blue-white tones matching a modern mobile messaging app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5CL4gZZXQTKZ9iLe6UwqEn7MN8cnQxl5v4it4jt4YdPRU-IWOr6alA_uSI4vFxbM3rpPkY5fEaaDDt6W2WC_KYZeIQLvdzC5Z_VFZISsKQX7F83xW45zNqpRWlCUoRGjynS7kh4o-TA5YgFnZRkJREu5spwogZFmTmDwF98f87jP3eBVYh88COiYeYQR2pdnEq38eB5NLwmF1bbQXMGgCuVlCfJjk7yjxq4NNjt5p">
<button aria-label="Change profile photo" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-md hover:bg-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">photo_camera</span>
</button>
</div>
<button class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" type="button">
      Change photo
    </button>
</div>
<form class="flex flex-col gap-space-md" id="edit-profile-form">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant px-space-xs" for="display-name">
        Display name
      </label>
<div class="h-[52px] rounded-[14px] bg-surface-container-lowest shadow-sm flex items-center px-space-md focus-within:bg-surface-container-low transition-colors">
<input class="w-full bg-transparent font-body-lg text-body-lg text-on-surface outline-none" id="display-name" placeholder="Enter your name" type="text" value="Ali Raza">
</div>
</div>
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between px-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="username-input">
          Username
        </label>
<button class="font-caption-xs text-caption-xs text-primary-container bg-primary-fixed/60 px-space-sm py-0.5 rounded-full hover:bg-primary-fixed transition-colors" id="toggle-username-state" type="button">
          Preview: Taken
        </button>
</div>
<div class="h-[52px] rounded-[14px] bg-surface-container-lowest shadow-sm flex items-center px-space-md gap-space-xs focus-within:bg-surface-container-low transition-colors" id="username-field-box">
<span class="font-body-lg text-body-lg text-outline select-none">@</span>
<input class="w-full bg-transparent font-body-lg text-body-lg text-on-surface outline-none" id="username-input" placeholder="username" type="text" value="ali_raza">
<span class="material-symbols-outlined text-[20px] text-tertiary" id="username-status-icon" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex items-center gap-space-xs px-space-xs pt-0.5" id="username-feedback">
<span class="font-caption text-caption text-tertiary">@ali_raza is available</span>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between px-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="bio-input">
          Bio
        </label>
<span class="font-caption-xs text-caption-xs text-outline" id="bio-counter">38/120</span>
</div>
<div class="rounded-[14px] bg-surface-container-lowest shadow-sm p-space-md focus-within:bg-surface-container-low transition-colors">
<textarea class="w-full bg-transparent font-body-lg text-body-lg text-on-surface outline-none resize-none" id="bio-input" maxlength="120" placeholder="Tell people a little about yourself..." rows="3">Coffee lover, weekend hiker &amp; builder.</textarea>
</div>
</div>
<div class="pt-space-sm">
<button class="w-full h-12 rounded-[14px] bg-primary-container text-on-primary font-label-md text-label-md shadow-md hover:bg-primary active:scale-[0.99] transition-all flex items-center justify-center gap-space-xs" id="bottom-save-btn" type="submit">
<span>Save</span>
</button>
</div>
</form>
<div class="flex items-center justify-center gap-space-sm py-space-sm px-space-md rounded-xl bg-tertiary-container text-on-tertiary shadow-md self-center transition-all duration-300" id="success-toast">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md">Profile updated</span>
</div>
</div>
<script>
  (function () {
    const bioInput = document.getElementById('bio-input');
    const bioCounter = document.getElementById('bio-counter');
    const toggleBtn = document.getElementById('toggle-username-state');
    const usernameInput = document.getElementById('username-input');
    const usernameIcon = document.getElementById('username-status-icon');
    const usernameFeedback = document.getElementById('username-feedback');
    const form = document.getElementById('edit-profile-form');
    const topSaveBtn = document.getElementById('top-save-btn');
    const toast = document.getElementById('success-toast');

    let isTaken = false;

    function updateBioCounter() {
      const len = bioInput.value.length;
      bioCounter.textContent = len + '/120';
    }

    bioInput.addEventListener('input', updateBioCounter);
    updateBioCounter();

    toggleBtn.addEventListener('click', function () {
      isTaken = !isTaken;
      const handle = usernameInput.value.trim() || 'ali_raza';
      if (isTaken) {
        toggleBtn.textContent = 'Preview: Available';
        usernameIcon.textContent = 'error';
        usernameIcon.classList.remove('text-tertiary');
        usernameIcon.classList.add('text-error');
        usernameFeedback.innerHTML = '<span class="font-caption text-caption text-error">@' + handle + ' is already taken</span>';
      } else {
        toggleBtn.textContent = 'Preview: Taken';
        usernameIcon.textContent = 'check_circle';
        usernameIcon.classList.remove('text-error');
        usernameIcon.classList.add('text-tertiary');
        usernameFeedback.innerHTML = '<span class="font-caption text-caption text-tertiary">@' + handle + ' is available</span>';
      }
    });

    function showToast() {
      toast.classList.remove('opacity-0', 'translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      showToast();
    });

    topSaveBtn.addEventListener('click', function () {
      showToast();
    });
  })();
</script></main>

</body></html>
