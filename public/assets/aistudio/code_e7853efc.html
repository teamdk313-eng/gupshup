t": "#464555", "on-secondary-container": "#006f64" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xs": "0.25rem", "margin": "1rem", "space-sm": "0.5rem", "space-md": "1rem", "space-lg": "1.5rem", "gutter": "1rem", "space-xl": "2rem" }, fontFamily: { "headline-md": ["Inter"], "headline-sm": ["Inter"], "caption": ["Inter"], "body-md": ["Inter"], "caption-xs": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Inter"], "label-md": ["Inter"] }, fontSize: { "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }], "caption": ["13px", { lineHeight: "18px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "caption-xs": ["11px", { lineHeight: "14px", fontWeight: "500" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-lg": ["28px", { lineHeight: "36px", fontWeight: "700" }], "label-md": ["14px", { lineHeight: "20px", fontWeight: "600" }] } } } };</script></head><body class="bg-black font-body-md text-white flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-gradient-to-b from-black/80 via-black/40 to-transparent backdrop-blur-sm"><div class="h-16 px-gutter flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Back" class="w-11 h-11 -ml-2 flex items-center justify-center rounded-full text-white/90 hover:text-white transition-colors shrink-0" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col min-w-0"><span class="font-headline-sm text-headline-sm text-white truncate leading-tight">Sara Malik</span><span class="font-caption-xs text-caption-xs text-white/70 leading-tight">Yesterday at 10:42 PM</span></div></div><div class="flex items-center gap-space-xs"><button aria-label="Download image" class="w-11 h-11 flex items-center justify-center rounded-full text-white/90 hover:text-white transition-colors"><span class="material-symbols-outlined text-[24px]">download</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 ml-1"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-black"><div class="flex flex-col w-full relative min-w-0 select-none pb-safe">
<!-- Immersive Media Canvas Container -->
<div class="relative w-full flex flex-col items-center justify-center overflow-hidden px-margin py-space-sm" id="viewer-stage">
<!-- Gesture / Zoom Feedback Pill -->
<div class="mb-space-sm z-20 flex items-center gap-space-xs bg-inverse-surface/80 backdrop-blur-md px-space-md py-1.5 rounded-full shadow-md transition-opacity duration-500" id="zoom-badge">
<span class="material-symbols-outlined text-inverse-on-surface text-[18px]">pinch</span>
<span class="font-caption-xs text-caption-xs text-inverse-on-surface font-medium tracking-wide">Pinch or double tap to zoom</span>
</div>
<!-- Interactive Image Wrapper with Zoom & Pan Micro-interaction -->
<div class="relative w-full aspect-[4/5] max-h-[58vh] flex items-center justify-center rounded-xl overflow-hidden bg-inverse-surface shadow-2xl group cursor-zoom-in" id="image-container">
<img alt="Design layout sketch attachment" class="w-full h-full object-cover transition-transform duration-300 ease-out transform" data-alt="A top-down aesthetic shot of an open spiral sketchbook showing sleek mobile wireframes and interface diagrams. Beside the notebook rests an artisanal ceramic cup of hot cappuccino with subtle latte art, accompanied by a premium matte-black stylus pen on a dark oak studio table in soft ambient cinematic morning light with indigo and warm amber reflections." id="preview-target" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcI4G9x_AZdn9n1cJfL1QbxAnImoS32sDyqi74L-WTyvy9CMUyHxFMb1l8woXuEgAJOh8meJyVDjXHNksq_hxAiQmaxdb74ku4MMq7fotyekpRM2EccgTxZk1KwnHneh8Y1bP_T3qk0Ew5FWDsBgZIyLw3MO2ZjHlNVDqbrYZbaPFp2_roEmL2Mr5qky_tqc4K8_7w-HJgne3TCDEeuvYFs9rJq_5v84V0w6d7AD-H"/>
<!-- Quick Zoom Level Indicator (Hidden by default, triggered via interaction) -->
<div class="absolute top-space-sm right-space-sm bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full opacity-0 transition-opacity pointer-events-none flex items-center gap-1" id="zoom-level-pill">
<span class="material-symbols-outlined text-white text-[14px]">zoom_in</span>
<span class="font-caption-xs text-caption-xs text-white" id="zoom-scale-text">100%</span>
</div>
<!-- Double Tap Ripple Target Visual (dynamic) -->
<div class="absolute w-16 h-16 rounded-full bg-white/20 pointer-events-none scale-0 transition-transform duration-300 opacity-0 flex items-center justify-center" id="tap-feedback">
<span class="material-symbols-outlined text-white text-[24px]">favorite</span>
</div>
</div>
<!-- Media Meta / Indicator Carousel Dots -->
<div class="flex items-center gap-1.5 mt-space-sm">
<span class="w-5 h-1.5 rounded-full bg-primary-fixed"></span>
<span class="w-1.5 h-1.5 rounded-full bg-outline/40"></span>
<span class="w-1.5 h-1.5 rounded-full bg-outline/40"></span>
</div>
</div>
<!-- Bottom Drawer: Context & Message Caption -->
<div class="w-full px-margin mt-space-xs flex flex-col gap-space-md z-30">
<!-- Caption Glass Card -->
<div class="bg-inverse-surface/85 backdrop-blur-xl p-space-md rounded-xl shadow-lg flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-secondary-fixed text-[18px]">chat_bubble</span>
<span class="font-caption-xs text-caption-xs text-inverse-on-surface/80">Attached Note</span>
</div>
<span class="font-caption-xs text-caption-xs text-inverse-on-surface/60">3.2 MB • PNG</span>
</div>
<p class="font-body-md text-body-md text-white font-normal leading-relaxed">
        Here is the rough layout sketch we discussed! Let me know what you think of the header spacing and floating reply pill.
      </p>
</div>
<!-- Action Toolbar Row -->
<div class="grid grid-cols-4 gap-space-xs bg-inverse-surface/60 backdrop-blur-md p-space-xs rounded-xl">
<!-- Forward / Share -->
<button aria-label="Forward media" class="h-12 flex flex-col items-center justify-center gap-0.5 rounded-lg active:bg-white/10 transition-colors text-white/90 hover:text-white">
<span class="material-symbols-outlined text-[20px]">forward</span>
<span class="font-caption-xs text-caption-xs">Forward</span>
</button>
<!-- Reply in Thread -->
<button aria-label="Reply to message" class="h-12 flex flex-col items-center justify-center gap-0.5 rounded-lg active:bg-white/10 transition-colors text-white/90 hover:text-white">
<span class="material-symbols-outlined text-[20px]">reply</span>
<span class="font-caption-xs text-caption-xs">Reply</span>
</button>
<!-- Star / Favorite -->
<button aria-label="Star message" class="h-12 flex flex-col items-center justify-center gap-0.5 rounded-lg active:bg-white/10 transition-colors text-white/90 hover:text-white" id="star-btn">
<span class="material-symbols-outlined text-[20px]" id="star-icon">star</span>
<span class="font-caption-xs text-caption-xs" id="star-label">Star</span>
</button>
<!-- Delete / More -->
<button aria-label="Delete media" class="h-12 flex flex-col items-center justify-center gap-0.5 rounded-lg active:bg-white/10 transition-colors text-error-container hover:text-white">
<span class="material-symbols-outlined text-[20px]">delete_outline</span>
<span class="font-caption-xs text-caption-xs">Delete</span>
</button>
</div>
</div>
<!-- Micro-interaction Logic -->
<script>
    (function() {
      const container = document.getElementById('image-container');
      const img = document.getElementById('preview-target');
      const badge = document.getElementById('zoom-badge');
      const zoomPill = document.getElementById('zoom-level-pill');
      const zoomScaleText = document.getElementById('zoom-scale-text');
      const tapFeedback = document.getElementById('tap-feedback');
      const starBtn = document.getElementById('star-btn');
      const starIcon = document.getElementById('star-icon');

      let isZoomed = false;
      let lastTap = 0;

      // Double tap to zoom toggle
      container.addEventListener('click', function(e) {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        
        if (tapLength < 300 && tapLength > 0) {
          e.preventDefault();
          toggleZoom();
          showHeartEffect(e);
        } else {
          // single click toggles subtle zoom
          toggleZoom();
        }
        lastTap = currentTime;
      });

      function toggleZoom() {
        isZoomed = !isZoomed;
        if (isZoomed) {
          img.style.transform = 'scale(1.85)';
          container.classList.remove('cursor-zoom-in');
          container.classList.add('cursor-zoom-out');
          zoomPill.style.opacity = '1';
          zoomScaleText.innerText = '185%';
          badge.style.opacity = '0';
        } else {
          img.style.transform = 'scale(1)';
          container.classList.remove('cursor-zoom-out');
          container.classList.add('cursor-zoom-in');
          zoomPill.style.opacity = '0';
          zoomScaleText.innerText = '100%';
          badge.style.opacity = '1';
        }
      }

      function showHeartEffect(e) {
        const rect = container.getBoundingClientRect();
        tapFeedback.style.left = (e.clientX - rect.left - 32) + 'px';
        tapFeedback.style.top = (e.clientY - rect.top - 32) + 'px';
        tapFeedback.style.opacity = '0.9';
        tapFeedback.style.transform = 'scale(1.25)';
        
        setTimeout(() => {
          tapFeedback.style.opacity = '0';
          tapFeedback.style.transform = 'scale(0)';
        }, 350);
      }

      // Star toggle
      let isStarred = false;
      starBtn.addEventListener('click', function() {
        isStarred = !isStarred;
        if (isStarred) {
          starIcon.style.fontVariationSettings = "'FILL' 1";
          starIcon.classList.add('text-secondary-fixed');
          starBtn.classList.add('text-secondary-fixed');
        } else {
          starIcon.style.fontVariationSettings = "'FILL' 0";
          starIcon.classList.remove('text-secondary-fixed');
          starBtn.classList.remove('text-secondary-fixed');
        }
      });
    })();
  </script>
</div></main></body></html>
