<script>
  (function () {
    const btnList = document.getElementById('btn-list-view');
    const btnEmpty = document.getElementById('btn-empty-view');
    const listContainer = document.getElementById('blocked-list-container');
    const emptyContainer = document.getElementById('empty-state-container');
    const toast = document.getElementById('toast-preview');
    const toastMsg = document.getElementById('toast-message');
    const toastDismiss = document.getElementById('toast-dismiss');
    const unblockButtons = document.querySelectorAll('.unblock-btn');

    function showList() {
      listContainer.classList.remove('hidden');
      listContainer.classList.add('flex');
      emptyContainer.classList.add('hidden');
      emptyContainer.classList.remove('flex');
      btnList.classList.add('bg-primary', 'text-on-primary');
      btnList.classList.remove('text-on-surface-variant');
      btnEmpty.classList.remove('bg-primary', 'text-on-primary');
      btnEmpty.classList.add('text-on-surface-variant');
    }

    function showEmpty() {
      listContainer.classList.add('hidden');
      listContainer.classList.remove('flex');
      emptyContainer.classList.remove('hidden');
      emptyContainer.classList.add('flex');
      btnEmpty.classList.add('bg-primary', 'text-on-primary');
      btnEmpty.classList.remove('text-on-surface-variant');
      btnList.classList.remove('bg-primary', 'text-on-primary');
      btnList.classList.add('text-on-surface-variant');
    }

    btnList.addEventListener('click', showList);
    btnEmpty.addEventListener('click', showEmpty);

    unblockButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        const row = btn.closest('.user-row');
        const name = row.getAttribute('data-name');
        toastMsg.textContent = name + ' unblocked';
        toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
        row.classList.add('opacity-50');
        btn.textContent = 'Unblocked';
        btn.disabled = true;
      });
    });

    toastDismiss.addEventListener('click', function () {
      toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
    });
  })();
</script></main>
